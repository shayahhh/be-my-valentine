<!DOCTYPE html>
<html>
<head>
    <title>For You ❤️</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #ffeef2; text-align: center; padding: 50px; }
        .page { display: none; }
        .active { display: block; }
        h1 { color: #d63384; }
        button { background-color: #ff4d6d; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 20px; cursor: pointer; margin: 10px; transition: 0.3s; }
        button:hover { background-color: #c9184a; transform: scale(1.1); }
        .gift-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .gift-box { width: 100px; height: 100px; background: #ff758f; line-height: 100px; border-radius: 10px; cursor: pointer; color: white; font-weight: bold; }
    </style>
</head>
<body>

    <div id="page1" class="page active">
        <h1>Will you be my Valentine? 🌹</h1>
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp4dm95Z3hndzZ3eGZ3eGZ3eGZ3eGZ3eGZ3eGZ3eGZ3eGZ3Jm1wPTY/Lp71UqhcHZiW4/giphy.gif" width="200">
        <br>
        <button onclick="nextPage('page2')">YES!</button>
        <button id="noButton" onmouseover="moveButton()">No</button>
    </div>

    <div id="page2" class="page">
        <h1>Yay! I knew you'd say yes! 🥰</h1>
        <p>Pick a gift box below:</p>
        <div class="gift-container">
            <div class="gift-box" onclick="nextPage('gift1')">Gift 1</div>
            <div class="gift-box" onclick="nextPage('gift2')">Gift 2</div>
        </div>
    </div>

    <div id="gift1" class="page">
        <h1>Gift #1: A Movie Date! 🍿</h1>
        <p>We're going to see whatever you want!</p>
        <button onclick="nextPage('page2')">Back</button>
    </div>

    <div id="gift2" class="page">
        <h1>Gift #2: Coffee & Flowers ☕🌷</h1>
        <button onclick="nextPage('page2')">Back</button>
    </div>

    <script>
        function nextPage(pageId) {
            // Hide all pages
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            // Show the selected page
            document.getElementById(pageId).classList.add('active');
        }

        function moveButton() {
            const btn = document.getElementById('noButton');
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            btn.style.position = 'absolute';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }
    </script>
</body>
</html>
