<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body { text-align: center; font-family: 'Arial', sans-serif; background-color: #ffe6e6; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        h1 { color: #d63384; font-size: 2.5rem; }
        .buttons { position: relative; width: 100%; height: 200px; }
        button { padding: 15px 30px; font-size: 1.2rem; cursor: pointer; border-radius: 50px; border: none; transition: 0.3s; position: absolute; }
        #yesBtn { background-color: #ff4d4d; color: white; left: 50%; transform: translateX(-120%); }
        #noBtn { background-color: #808080; color: white; left: 50%; transform: translateX(20%); }
    </style>
</head>
<body>
    <h1>Will you be my Valentine? ❤️</h1>
    <div class="buttons">
        <button id="yesBtn" onclick="alert('Yay! Best Valentine ever! 🥰')">Yes</button>
        <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
    </div>

    <script>
        function moveButton() {
            const btn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
            btn.style.transform = 'none'; // Removes the initial centering
        }
    </script>
</body>
</html>
